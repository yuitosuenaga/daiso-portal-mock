name: docker-build

# Dockerfile 周りの変更時のみ、runner / migrate の両ターゲットがビルドできることを確認する。
# push・ログイン・デプロイは行わない。必須チェックにはしない。

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "prisma/**"
      - "next.config.mjs"
      - ".github/workflows/docker-build.yml"

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --target runner .
      - run: docker build --target migrate .
