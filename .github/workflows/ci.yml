name: ci

# アプリコードの検証。必須チェックは verify のみ（docs/infra/app-ci.md）。
# paths フィルタは付けない（必須チェックが「未実行」で止まるのを防ぐため）。
# secrets は参照しない。pull_request_target は使わない。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "20"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
        env:
          TZ: Asia/Tokyo
      - run: npm run build

  integration:
    # 使い捨ての postgres コンテナに全マイグレーションを適用し、DB 結合テストを実行する。
    # 必須チェックにはしない（安定後に追加を検討）。
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # CI の使い捨てコンテナ向け（本番 DB ではない）
      - run: npx prisma migrate deploy
      - run: npx vitest run integration --no-file-parallelism
        env:
          TZ: Asia/Tokyo
          STAFF_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          THROTTLE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          INQUIRY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          MONTHLY_MATERIAL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          EMAIL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          COMPANY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  audit:
    # 必須チェックにはしない。新規脆弱性の公開で突然赤くなり得るため情報提供扱い。
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm audit --omit=dev --audit-level=high
